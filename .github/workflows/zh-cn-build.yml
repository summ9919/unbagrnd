name: zh-cn Windows build

# 中文版（zh-cn 分支）Windows 安装包自动构建。
#
# 三种触发方式：
#   1) push              —— 向 zh-cn 分支推送提交时自动构建
#   2) workflow_dispatch —— 在 Actions 页面手动 Run workflow
#   3) schedule          —— 每周一 01:00 UTC（北京时间 09:00）定时构建，用于跟进上游更新
on:
  push:
    branches:
      - zh-cn
  workflow_dispatch: {}
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: read

concurrency:
  group: zh-cn-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows MSI + NSIS (zh-CN)
    runs-on: windows-latest
    steps:
      - name: Checkout zh-cn
        uses: actions/checkout@v7
        with:
          ref: zh-cn
          fetch-depth: 0

      # 构建前先合并上游 zidniryi/unbagrnd 的 main 最新提交：
      #   无冲突 -> 带着上游最新代码一起构建，保证中文包基于最新上游；
      #   有冲突 -> 本步骤直接失败并终止构建，避免产出来源不明的安装包。
      # 说明：这里只做本地合并用于构建，不会把合并结果推回 fork。
      - name: Merge upstream main before build
        shell: pwsh
        run: |
          git config user.name "zh-cn builder"
          git config user.email "zh-cn-builder@users.noreply.github.com"
          git remote add upstream https://github.com/zidniryi/unbagrnd.git
          git fetch --no-tags upstream main
          Write-Host "upstream/main = $(git rev-parse --short upstream/main)"
          git merge-base --is-ancestor upstream/main HEAD
          if ($LASTEXITCODE -eq 0) {
            Write-Host "upstream/main 已包含在当前分支中，无需合并。"
          }
          else {
            git merge --no-edit upstream/main
            if ($LASTEXITCODE -ne 0) {
              git merge --abort
              Write-Host "::error::合并 upstream/main 失败：存在冲突。请在本地将上游改动合入 zh-cn 分支并解决冲突后再推送，本次构建已终止。"
              exit 1
            }
          }
          Write-Host "本次构建提交：$(git rev-parse --short HEAD)"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # 依赖安装方式与仓库锁文件保持一致：本仓库使用 package-lock.json，因此用 npm ci。
      - name: Install frontend dependencies
        run: npm ci

      # 只构建 Windows 中文版安装包：MSI（wix 语言已在 tauri.conf.json 中设为 zh-CN）与 NSIS。
      - name: Build Windows bundles (MSI + NSIS)
        run: npm run build -- --bundles msi,nsis

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: unbagrnd-zh-CN-windows-r${{ github.run_number }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30